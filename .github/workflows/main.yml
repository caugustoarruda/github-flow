name: Runners
# qual evento ira dar o trigger na pipeline
on:
  # push:
  #   branches: ["main"]
  workflow_dispatch:
env:
  ENV_WORKFLOW: "ENV WORKFLOW"
jobs:
  runner-job:
    name: "Meu primeiro Job"
    # onde sera executado a ação
    runs-on: ubuntu-latest
    steps:
      - name: Instrala o ffmpeg
        run: |
          sudo apt update --yes
          sudo apt install ffmpeg --yes
      - name: "Verifica se existe o ffmpeg"
        run: |
          ffmpeg --help
          echo $ENV_WORKFLOW
